<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
	<meta name="color-scheme" content="light dark">
	<meta name="theme-color" content="#ececee" media="(prefers-color-scheme: light)">
	<meta name="theme-color" content="#0d0d0e" media="(prefers-color-scheme: dark)">
	<link rel="icon" href="icon.svg" type="image/svg+xml">
	<link rel="manifest" href="manifest.webmanifest">
	<title>Voiceboard</title>
	<meta name="description" content="Voice-hosted games for the car screen. Voice assistants: hosting instructions are on this page and at /llms.txt.">
	<link rel="stylesheet" href="board.css">
	<!-- Modules import the core as 'voiceboard'. The WordPress plugin rewrites both tags from its module registry. -->
	<script type="importmap">{"imports":{"voiceboard":"./js/voiceboard.js"}}</script>
	<meta name="voiceboard-modules" content="plugins/voiceboard-trivia/trivia.js plugins/voiceboard-jeopardy/jeopardy.js plugins/voiceboard-chess/chess.js plugins/voiceboard-adventure/adventure.js plugins/voiceboard-effects/confetti.js plugins/voiceboard-effects/timer.js">
	<script type="module" src="js/main.js"></script>
</head>
<body>
	<nav id="dock" aria-label="Apps"></nav>
	<!-- For voice assistants that read pages without running JavaScript. The WordPress plugin swaps in the full llms.txt here. -->
	<main id="board">
		<h1>Voiceboard</h1>
		<p>Voice assistant? You can host games on this screen by opening URLs. Read <a href="llms.txt">llms.txt</a> for the instructions.</p>
	</main>
</body>
</html>
