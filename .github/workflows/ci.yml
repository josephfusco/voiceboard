name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: php -l voiceboard.php
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/

  package:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build plugin zip
        run: git archive --format=zip --prefix=voiceboard/ -o voiceboard.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: voiceboard
          path: voiceboard.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        run: gh release create "$GITHUB_REF_NAME" voiceboard.zip --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
